<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Ayori — Every detail. Side by side.</title>
  <desc id="description">Ayori repository social preview banner. Precise image comparison built for your next encode.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60AE97" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#253A32"/>
      <stop offset="1" stop-color="#F0ECE2" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="frame-grad" x1="0" y1="0" x2="280" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AFE6D3" stop-opacity=".12"/>
      <stop offset="1" stop-color="#AFE6D3" stop-opacity="0.01"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="890" cy="330" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3F32" stop-opacity=".38"/>
      <stop offset="65%" stop-color="#0E231B" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="left-glow" cx="190" cy="290" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#153026" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <g id="facet">
      <path d="M10 83 40 17H58L28 83Z" fill="#AFE6D3"/>
      <path d="M62 25 89 83H68L52 48Z" fill="#F0ECE2"/>
      <path d="M39 63H56L64 80H31Z" fill="#60AE97"/>
    </g>
  </defs>

  <!-- Deep black canvas -->
  <rect width="1280" height="640" fill="#000000"/>
  
  <!-- Ambient glows for richness and depth -->
  <rect width="1280" height="640" fill="url(#card-glow)"/>
  <rect width="1280" height="640" fill="url(#left-glow)"/>

  <!-- Subtle diagonal accent lines -->
  <path d="M680 0 380 640M940 0 640 640M1200 0 900 640" stroke="#AFE6D3" stroke-opacity=".045" stroke-width="1.2"/>

  <!-- Outer frame border with rounded corners -->
  <rect x="2" y="2" width="1276" height="636" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- Typography & Visuals -->
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Top badge -->
    <circle cx="92" cy="158" r="3.5" fill="#AFE6D3"/>
    <text x="106" y="162.5" fill="#93B5A8" font-size="13" font-weight="600" letter-spacing="3.2">A CLOSER LOOK</text>

    <!-- Logo & Brand Title -->
    <use href="#facet" transform="translate(80 188) scale(1.05)"/>
    <text x="196" y="266" fill="#F0ECE2" font-size="80" font-weight="650" letter-spacing="-2.5">Ayori</text>

    <!-- Main Headline -->
    <text x="90" y="342" font-size="38" font-weight="500" letter-spacing="-.8">
      <tspan fill="#F0ECE2">Every detail.</tspan>
      <tspan fill="#AFE6D3"> Side by side.</tspan>
    </text>

    <!-- Subtitle description -->
    <text x="92" y="387" fill="#9CADA5" font-size="20" font-weight="400" letter-spacing="-.2">
      Precise image comparison. Built for your next encode.
    </text>

    <!-- Accent Divider -->
    <path d="M92 426H620" stroke="#23382E" stroke-width="1.5"/>

    <!-- Bottom Feature Tags -->
    <text x="92" y="461" fill="#AFE6D3" font-size="13.5" font-weight="600" letter-spacing="1.8">COMPARE</text>
    <circle cx="212" cy="457" r="2.5" fill="#416B5B"/>
    <text x="235" y="461" fill="#F0ECE2" font-size="13.5" font-weight="600" letter-spacing="1.8">INSPECT</text>
    <circle cx="348" cy="457" r="2.5" fill="#416B5B"/>
    <text x="372" y="461" fill="#AFE6D3" font-size="13.5" font-weight="600" letter-spacing="1.8">SHARE</text>

    <!-- Right Side Comparison Component -->
    <!-- Back Card: Reference -->
    <g transform="translate(745, 172)">
      <rect width="280" height="270" rx="15" fill="#040A08" stroke="#60AE97" stroke-opacity=".55" stroke-width="1.2"/>
      <rect x="14" y="14" width="252" height="242" rx="9" fill="url(#frame-grad)"/>
      <text x="26" y="48" fill="#AFE6D3" font-size="12" font-weight="600" letter-spacing="1.5">A / REFERENCE</text>
      <use href="#facet" transform="translate(45 68) scale(1.85)"/>
    </g>

    <!-- Front Card: Compare -->
    <g transform="translate(935, 232)">
      <rect width="270" height="250" rx="15" fill="#060A08" stroke="#F0ECE2" stroke-opacity=".35" stroke-width="1.2"/>
      <rect x="14" y="14" width="242" height="222" rx="9" fill="#F0ECE2" fill-opacity=".025"/>
      <text x="26" y="48" fill="#E0C795" font-size="12" font-weight="600" letter-spacing="1.5">B / COMPARE</text>
      <use href="#facet" transform="translate(56 65) scale(1.55)"/>
    </g>

    <!-- Comparison Split Handle & Divider -->
    <path d="M935 272V448" stroke="#AFE6D3" stroke-width="2.5"/>
    <circle cx="935" cy="360" r="16" fill="#000000" stroke="#AFE6D3" stroke-width="2"/>
    <path d="m930 355-5 5 5 5m10-10 5 5-5 5" stroke="#AFE6D3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
