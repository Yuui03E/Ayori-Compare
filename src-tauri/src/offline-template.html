<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'"><title>Ayori Compare — Offline comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#dae6df;font:12px system-ui}canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}button,select{font:inherit;color:inherit;background:#202826;border:1px solid #ffffff15;border-radius:5px;padding:8px;cursor:pointer}button:hover{background:#314039}button.a,button.active{border-color:#88dac1;color:#b5e6d4}button.b{box-shadow:inset 0 -2px #d9b77c}button.missing{opacity:.4}header,nav,footer{position:fixed;background:#101816de;border:1px solid #ffffff14;border-radius:10px;backdrop-filter:blur(14px);padding:12px}header{top:16px;left:50%;transform:translateX(-50%);max-width:90vw}h1{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.2em;color:#8da69a;margin:0 0 10px}#sources{display:flex;gap:6px;overflow:auto}nav{left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}nav label{font-size:9px;color:#8aa194;padding-top:8px}input{width:85px;accent-color:#93d8be}footer{bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;white-space:nowrap}#status{position:fixed;bottom:9px;left:16px;font:10px monospace;color:#98aea1}#pixels{position:fixed;right:16px;bottom:90px;max-width:80vw;background:#101816d9;padding:8px;border-radius:5px;font:10px monospace;pointer-events:none}.hint{font-size:9px;color:#738f7e;margin-left:12px}.hide-controls header,.hide-controls nav,.hide-controls footer{display:none}@media(max-width:900px){.hint{display:none}footer{max-width:95vw;overflow:auto}nav{left:8px;padding:6px}}
