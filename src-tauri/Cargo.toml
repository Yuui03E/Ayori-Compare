[package]
name = "ayori-compare"
version = "0.1.0"
description = "Precise desktop image comparison for anime encoders"
license = "MIT"
authors = ["Ayori Project"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "ayori_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Opt-in local measurement commands; omitted from normal release builds.
diagnostics = []

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
regex = "1.11"
notify = "8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
avif-decode = { version = "3", default-features = false }
avif-parse = "2.1"
fast-ssim2 = { version = "0.9", features = ["rayon"] }
tokio = { version = "1", features = ["sync"] }
flate2 = "1"
tempfile = "3"

[dev-dependencies]
png = "0.18"
arboard = "3.7"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Memory"] }

[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.fast-ssim2]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
[profile.dev.package.yuv]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

# Keep pixel work fast while optimizing the windowing/UI glue for executable size.
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.fast-ssim2]
opt-level = 3
[profile.release.package.rav1d]
opt-level = 3
[profile.release.package.yuv]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
