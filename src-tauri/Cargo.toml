[package]
name = "ayori-compare"
version = "0.1.0"
description = "Precise desktop image comparison for anime encoders"
authors = ["Ayori Project"]
edition = "2024"
rust-version = "1.89"

[lib]
name = "ayori_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
