[package]
name = "ayori-compare"
version = "0.1.0"
description = "Precise desktop image comparison for anime encoders"
authors = ["Ayori Project"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "ayori_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
regex = "1.11"
notify = "8"
base64 = "0.22"
zune-core = "0.5"
zune-png = "0.5"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
avif-decode = { version = "3", default-features = false }
avif-parse = "2.1"
fast-ssim2 = { version = "0.9", features = ["rayon"] }
tokio = { version = "1", features = ["sync"] }
flate2 = "1"
tempfile = "3"

[profile.dev.package.zune-png]
opt-level = 3
[profile.dev.package.zune-inflate]
opt-level = 3
[profile.dev.package.fast-ssim2]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
[profile.dev.package.yuv]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
